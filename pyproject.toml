[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finxcore-digital-banking-platform"
version = "1.0.0"
description = "FinXCore Intelligent Digital Banking & Financial Super Platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "FinXCore Commercial Proprietary License" }
authors = [
    { name = "Dhanunjay Narra", email = "dhanunjay.narra@example.com" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.1.2",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "python-dotenv>=1.0.1"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = [
    "tests",
]
python_files = ["test_*.py"]
